<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>砌好厝3.0｜工程資源中心</title>
<meta name="description" content="砌好厝3.0｜整合工程需求、專業成員與智慧媒合的工程資源中心">
<meta property="og:type" content="website">
<meta property="og:title" content="砌好厝3.0｜工程資源中心">
<meta property="og:description" content="整合工程需求、專業成員與智慧媒合">
<meta property="og:url" content="https://mrbusinesslab.github.io/BNI-Building/?v=3">
<meta property="og:image" content="https://mrbusinesslab.github.io/BNI-Building/logo.png">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="砌好厝3.0｜工程資源中心">
<meta name="twitter:description" content="整合工程需求、專業成員與智慧媒合">
</head>
<body>
<div id="loading" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans TC','Microsoft JhengHei',sans-serif;padding:32px;color:#17323d">載入中…</div>
<script>
(async()=>{
  try{
    const files=['site/part1.txt','site/part2.txt','site/part3.txt','site/part4.txt','site/part5.txt','site/part6.txt','site/part7.txt'];
    const parts=await Promise.all(files.map(f=>fetch(f,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error(f);return r.text();})));
    let page=parts.join('');
    page=page.replace(
      '<div class="brandmark">建</div>',
      '<div class="brandmark"><img src="logo.png" alt="砌好厝3.0 Logo" style="width:42px;height:42px;object-fit:cover;border-radius:12px;display:block"></div>'
    );
    page=page.replace(
      '<a class="tag" href="https://mrbusinesslab.github.io/BNI-Building/admin/" style="text-decoration:none">後台管理</a>',
      '<a class="tag admin-edit-link" href="https://mrbusinesslab.github.io/BNI-Building/admin/" target="_blank" rel="noopener" aria-label="編輯內容" title="編輯內容" style="text-decoration:none">✎</a>'
    );
    page=page.replace('MR BUSINESS LAB｜砌好厝3.0','MR BUSINESS LAB｜砌好厝3.0');
    page=page.replace('<body>','<body class="data-pending">');
    page=page.replaceAll('由後台指定此步驟負責成員','');
    page=page.replaceAll('此成員已由後台設定為此類別的配對人選','');
    page=page.replaceAll('目前尚未設定此類別的步驟配對成員。','目前尚無推薦人選。');
    page=page.replace('</head>',`<style>
      .flow-role-sub:empty{display:none}
      .admin-edit-link{width:38px;height:38px;padding:0!important;display:grid!important;place-items:center;font-size:21px!important;line-height:1;border-radius:50%!important}
      body.data-pending .needs,body.data-pending .solution,body.data-pending .match-zone,body.data-pending .directory-section{visibility:hidden}
      body.data-pending .section:has(.needs)::after{content:'需求載入中…';display:block;color:#6b7b82;font-size:14px;padding:18px 0}
    </style></head>`);
    page=page.replace('</body>',`<script>
(function(){
  let ready=false;
  function revealWhenReady(){
    if(typeof needsData!=='undefined'&&Array.isArray(needsData)&&needsData.some(n=>n&&n.key&&n.key!=='unknown')){
      ready=true;document.body.classList.remove('data-pending');return true;
    }
    return false;
  }
  window.addEventListener('DOMContentLoaded',()=>{
    const timer=setInterval(()=>{if(revealWhenReady())clearInterval(timer)},80);
    setTimeout(()=>{if(!ready){document.body.classList.remove('data-pending');clearInterval(timer)}},5000);
  });
  document.addEventListener('click',e=>{
    const unknown=e.target.closest('[data-need-key="unknown"]');
    if(unknown&&typeof selectNeed==='function')selectNeed('unknown',false);
  },true);
})();
<\/script></body>`);
    document.open();
    document.write(page);
    document.close();
  }catch(err){
    document.getElementById('loading').textContent='網站載入失敗，請重新整理。';
    console.error(err);
  }
})();
</script>
</body>
</html>
