<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>磐石建築組｜內容管理後台</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#f4f7f8;--ink:#17323d;--muted:#6c7d84;--line:#d8e3e7;--brand:#00465f;--soft:#eaf2f5;--danger:#b83c3c;--ok:#1d7a4b}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","Microsoft JhengHei",sans-serif;background:var(--bg);color:var(--ink)}button,input,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}.btn{border:0;border-radius:12px;padding:11px 15px;font-weight:800}.primary{background:var(--brand);color:#fff}.secondary{background:var(--soft);color:var(--brand)}.ghost{background:#fff;border:1px solid var(--line);color:var(--ink)}.danger{background:#fff0f0;color:var(--danger);border:1px solid #f0c6c6}.login-wrap{min-height:100vh;display:grid;place-items:center;padding:24px}.login-card{width:min(440px,100%);background:#fff;border:1px solid var(--line);border-radius:22px;padding:28px;box-shadow:0 20px 60px rgba(0,70,95,.12)}.login-brand{display:flex;align-items:center;gap:12px;margin-bottom:18px}.login-brand img,.brand img{width:56px;height:56px;object-fit:cover;border-radius:14px}.login-brand h1{margin:0;font-size:24px}.status,.help{font-size:12px;color:var(--muted)}.field{display:grid;gap:7px;margin-bottom:14px}.field label{font-size:13px;font-weight:800}.field input,.field textarea{width:100%;border:1px solid var(--line);border-radius:11px;padding:11px 12px;background:#fff;color:var(--ink)}.field input[readonly]{background:#f4f7f8;color:#51656d}.field textarea{min-height:120px;resize:vertical;line-height:1.65}.notice{padding:11px 13px;border-radius:10px;font-size:13px;margin-bottom:14px}.notice.ok{background:#eaf7f0;color:var(--ok)}.notice.error{background:#fff0f0;color:var(--danger)}.topbar{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:12px 20px}.brand{display:flex;align-items:center;gap:12px;font-weight:900}.brand img{width:46px;height:46px}.brand small{display:block;color:var(--muted);font-size:12px;font-weight:600}.layout{display:grid;grid-template-columns:280px minmax(0,1fr);min-height:calc(100vh - 71px)}.sidebar{border-right:1px solid var(--line);background:#fff;padding:18px;overflow:auto}.sidebar h3{font-size:14px;margin:0 0 12px;color:var(--muted)}.member-list{display:grid;gap:8px}.member-item{width:100%;text-align:left;border:1px solid var(--line);background:#fff;border-radius:12px;padding:12px}.member-item:hover,.member-item.active{border-color:#8eb6c3;background:var(--soft)}.member-item b{display:block;font-size:15px}.member-item span{font-size:12px;color:var(--muted)}.main{padding:24px;min-width:0}.page-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:18px}.page-head h1{margin:0;font-size:28px}.page-head p{margin:6px 0 0;color:var(--muted)}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}.tab{border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 13px;font-weight:800}.tab.active{background:var(--brand);color:#fff;border-color:var(--brand)}.panel{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px;margin-bottom:16px}.panel h2{font-size:19px;margin:0 0 14px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}.savebar{display:flex;justify-content:flex-end}.repeat-list{display:grid;gap:12px}.repeat-card{border:1px solid var(--line);border-radius:14px;padding:16px;background:#fbfcfd}.repeat-head{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:12px}.inline-actions{display:flex;gap:8px;flex-wrap:wrap}.empty{border:1px dashed var(--line);border-radius:14px;padding:24px;text-align:center;color:var(--muted)}.preview-img{max-width:180px;max-height:120px;border-radius:10px;border:1px solid var(--line);object-fit:cover;margin-top:10px}@media(max-width:900px){.layout{grid-template-columns:1fr}.sidebar{border-right:0;border-bottom:1px solid var(--line);max-height:230px}.grid2{grid-template-columns:1fr}.main{padding:18px}.page-head{flex-direction:column}.topbar{padding:10px 14px}}
</style>
</head>
<body>
<div id="loginView" class="login-wrap">
  <div class="login-card">
    <div class="login-brand"><img src="../logo.png" alt="Logo"><div><h1>磐石建築組</h1><div class="status">內容管理後台</div></div></div>
    <p style="color:var(--muted);line-height:1.7">使用固定管理員帳號登入，不需要建立帳號或收驗證信。</p>
    <div id="loginNotice"></div>
    <div class="field"><label>管理員帳號</label><input id="email" value="mr.business.labb@gmail.com" readonly></div>
    <div class="field"><label>密碼</label><input id="password" type="password" autocomplete="current-password" placeholder="請輸入管理員密碼"></div>
    <button class="btn primary" id="loginBtn" style="width:100%">登入後台</button>
  </div>
</div>

<div id="appView" class="hidden">
  <div class="topbar"><div class="brand"><img src="../logo.png"><div>磐石建築組<small>內容管理後台</small></div></div><div><span class="status">mr.business.labb@gmail.com</span> <button class="btn ghost" id="logoutBtn">登出</button></div></div>
  <div class="layout">
    <aside class="sidebar"><h3>建築組成員</h3><div id="memberList" class="member-list"></div></aside>
    <main class="main">
      <div id="globalNotice"></div>
      <div id="editorEmpty" class="empty">請先從左側選擇一位成員。</div>
      <div id="editor" class="hidden">
        <div class="page-head"><div><h1 id="memberTitle"></h1><p id="memberSubtitle"></p></div><button class="btn secondary" id="refreshBtn">重新讀取</button></div>
        <div class="tabs"><button class="tab active" data-tab="basic">基本資料／自我介紹</button><button class="tab" data-tab="cases">案例</button><button class="tab" data-tab="collabs">BNI 合作經歷</button><button class="tab" data-tab="contacts">聯絡方式</button></div>

        <section id="tab-basic" class="tabpane"><div class="panel"><h2>基本資料</h2><div class="grid2"><div class="field"><label>姓名</label><input id="m_name"></div><div class="field"><label>公司</label><input id="m_company"></div><div class="field"><label>職稱</label><input id="m_title"></div><div class="field"><label>一句話專業定位</label><input id="m_tagline"></div></div><div class="field"><label>自我介紹</label><textarea id="m_intro" placeholder="沒有內容時，前台不顯示此區塊。"></textarea></div><div class="field"><label>電子名片 JSON URL</label><input id="m_card_json_url" placeholder="可留空"></div><div class="savebar"><button class="btn primary" id="saveBasicBtn">儲存基本資料</button></div></div></section>
        <section id="tab-cases" class="tabpane hidden"><div class="panel"><div class="repeat-head"><h2 style="margin:0">案例</h2><button class="btn primary" id="addCaseBtn">＋ 新增案例</button></div><div id="caseList" class="repeat-list"></div></div></section>
        <section id="tab-collabs" class="tabpane hidden"><div class="panel"><div class="repeat-head"><h2 style="margin:0">BNI 合作經歷</h2><button class="btn primary" id="addCollabBtn">＋ 新增合作經歷</button></div><div id="collabList" class="repeat-list"></div></div></section>
        <section id="tab-contacts" class="tabpane hidden"><div class="panel"><div class="repeat-head"><h2 style="margin:0">聯絡方式</h2><button class="btn primary" id="addContactBtn">＋ 新增聯絡方式</button></div><div id="contactList" class="repeat-list"></div></div></section>
      </div>
    </main>
  </div>
</div>

<script>
const U='https://packaiwgsswrjvxdsejw.supabase.co';
const K='sb_publishable_Jrp7cxW-ppSJtrk-lScZjA_blNEnBRG';
const EMAIL='mr.business.labb@gmail.com';
const base=supabase.createClient(U,K,{auth:{persistSession:false}});
let sb=null,token=localStorage.getItem('bni_admin_token')||'',members=[],current=null;
const $=id=>document.getElementById(id);
const esc=(v='')=>String(v).replace(/[&<>"']/g,s=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[s]));
const note=(el,msg,type='ok')=>el.innerHTML=msg?`<div class="notice ${type}">${esc(msg)}</div>`:'';
async function sha256(s){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
function makeAdminClient(){sb=supabase.createClient(U,K,{auth:{persistSession:false},global:{headers:{'x-bni-admin-token':token}}})}
function showApp(){makeAdminClient();$('loginView').classList.add('hidden');$('appView').classList.remove('hidden')}
function showLogin(){ $('appView').classList.add('hidden');$('loginView').classList.remove('hidden') }

$('loginBtn').onclick=async()=>{
  note($('loginNotice'),'');
  const pw=$('password').value;
  if(!pw)return note($('loginNotice'),'請輸入密碼。','error');
  $('loginBtn').disabled=true;$('loginBtn').textContent='登入中…';
  try{
    const hash=await sha256(pw);
    const {data,error}=await base.rpc('bni_admin_login',{p_email:EMAIL,p_password_sha256:hash});
    if(error||!data){note($('loginNotice'),'帳號或密碼錯誤。','error');return}
    token=data;localStorage.setItem('bni_admin_token',token);$('password').value='';showApp();await loadMembers();
  }catch(e){note($('loginNotice'),'登入失敗：'+e.message,'error')}
  finally{$('loginBtn').disabled=false;$('loginBtn').textContent='登入後台'}
};
$('password').addEventListener('keydown',e=>{if(e.key==='Enter')$('loginBtn').click()});
$('logoutBtn').onclick=async()=>{try{await base.rpc('bni_admin_logout',{p_token:token})}catch{}localStorage.removeItem('bni_admin_token');token='';sb=null;location.reload()};
$('refreshBtn').onclick=()=>current&&selectMember(current.id);

async function loadMembers(){
  const {data,error}=await sb.from('bni_members').select('*').order('sort_order');
  if(error){if(String(error.message).toLowerCase().includes('permission')){localStorage.removeItem('bni_admin_token');return location.reload()}return note($('globalNotice'),'讀取成員失敗：'+error.message,'error')}
  members=data||[];$('memberList').innerHTML=members.map(m=>`<button class="member-item ${current?.id===m.id?'active':''}" data-id="${m.id}"><b>${esc(m.name)}</b><span>${esc(m.company||'')}</span></button>`).join('');
  document.querySelectorAll('.member-item').forEach(b=>b.onclick=()=>selectMember(b.dataset.id));
}
async function selectMember(id){
  current=members.find(x=>x.id===id);if(!current)return;
  document.querySelectorAll('.member-item').forEach(x=>x.classList.toggle('active',x.dataset.id===id));
  $('editorEmpty').classList.add('hidden');$('editor').classList.remove('hidden');$('memberTitle').textContent=current.name;$('memberSubtitle').textContent=current.company||'';
  ['name','company','title','tagline','intro','card_json_url'].forEach(k=>$('m_'+k).value=current[k]||'');
  await Promise.all([loadCases(),loadCollabs(),loadContacts()]);
}
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===t));document.querySelectorAll('.tabpane').forEach(x=>x.classList.add('hidden'));$('tab-'+t.dataset.tab).classList.remove('hidden')});

$('saveBasicBtn').onclick=async()=>{
  const p={name:$('m_name').value.trim(),company:$('m_company').value.trim(),title:$('m_title').value.trim(),tagline:$('m_tagline').value.trim(),intro:$('m_intro').value.trim(),card_json_url:$('m_card_json_url').value.trim()||null};
  const {data,error}=await sb.from('bni_members').update(p).eq('id',current.id).select().single();if(error)return note($('globalNotice'),'儲存失敗：'+error.message,'error');
  current=data;members=members.map(x=>x.id===data.id?data:x);note($('globalNotice'),'基本資料已儲存。');await loadMembers();
};
async function chooseImage(){const i=document.createElement('input');i.type='file';i.accept='image/*';return await new Promise(r=>{i.onchange=()=>r(i.files?.[0]||null);i.click()})}
async function upload(file,kind){if(!file)return null;const ext=(file.name.split('.').pop()||'jpg').toLowerCase(),path=`${current.slug}/${kind}/${Date.now()}-${Math.random().toString(36).slice(2,8)}.${ext}`;const {error}=await sb.storage.from('bni-building-media').upload(path,file,{contentType:file.type||undefined});if(error)throw error;return sb.storage.from('bni-building-media').getPublicUrl(path).data.publicUrl}
async function del(table,id,reload){if(!confirm('確定刪除這筆資料？'))return;const {error}=await sb.from(table).delete().eq('id',id);if(error)return note($('globalNotice'),'刪除失敗：'+error.message,'error');note($('globalNotice'),'已刪除。');reload()}

async function loadCases(){const {data,error}=await sb.from('bni_member_cases').select('*').eq('member_id',current.id).order('sort_order').order('created_at');if(error)return note($('globalNotice'),error.message,'error');$('caseList').innerHTML=data?.length?data.map(c=>`<div class="repeat-card" data-c="${c.id}"><div class="repeat-head"><b>${esc(c.title)}</b><div class="inline-actions"><button class="btn secondary e">編輯</button><button class="btn danger d">刪除</button></div></div>${c.image_url?`<img class="preview-img" src="${esc(c.image_url)}">`:''}<div class="help">${esc(c.description||'')}</div></div>`).join(''):'<div class="empty">目前沒有案例。</div>';document.querySelectorAll('[data-c]').forEach(x=>{x.querySelector('.e').onclick=()=>editCase(x.dataset.c);x.querySelector('.d').onclick=()=>del('bni_member_cases',x.dataset.c,loadCases)})}
$('addCaseBtn').onclick=()=>editCase();
async function editCase(id=null){let r={};if(id){const q=await sb.from('bni_member_cases').select('*').eq('id',id).single();r=q.data||{}}const title=prompt('案例標題',r.title||'');if(title===null)return;const description=prompt('案例說明',r.description||'');if(description===null)return;const link_url=prompt('案例連結（可留空）',r.link_url||'');if(link_url===null)return;let image_url=r.image_url||null;if(confirm('要上傳／更換案例圖片嗎？')){const f=await chooseImage();if(f)try{image_url=await upload(f,'cases')}catch(e){return note($('globalNotice'),'圖片上傳失敗：'+e.message,'error')}}const p={member_id:current.id,title,description,link_url:link_url||null,image_url,is_published:true};const q=id?sb.from('bni_member_cases').update(p).eq('id',id):sb.from('bni_member_cases').insert(p);const {error}=await q;if(error)return note($('globalNotice'),'案例儲存失敗：'+error.message,'error');note($('globalNotice'),'案例已儲存。');loadCases()}

async function loadCollabs(){const {data,error}=await sb.from('bni_member_collaborations').select('*').eq('member_id',current.id).order('sort_order').order('created_at');if(error)return note($('globalNotice'),error.message,'error');$('collabList').innerHTML=data?.length?data.map(c=>`<div class="repeat-card" data-b="${c.id}"><div class="repeat-head"><b>${esc(c.title)}</b><div class="inline-actions"><button class="btn secondary e">編輯</button><button class="btn danger d">刪除</button></div></div><div class="help">${esc(c.partner_name||'')}${c.collaboration_date?'｜'+esc(c.collaboration_date):''}</div>${c.image_url?`<img class="preview-img" src="${esc(c.image_url)}">`:''}<div class="help">${esc(c.description||'')}</div></div>`).join(''):'<div class="empty">目前沒有 BNI 合作經歷。</div>';document.querySelectorAll('[data-b]').forEach(x=>{x.querySelector('.e').onclick=()=>editCollab(x.dataset.b);x.querySelector('.d').onclick=()=>del('bni_member_collaborations',x.dataset.b,loadCollabs)})}
$('addCollabBtn').onclick=()=>editCollab();
async function editCollab(id=null){let r={};if(id){const q=await sb.from('bni_member_collaborations').select('*').eq('id',id).single();r=q.data||{}}const title=prompt('合作標題',r.title||'');if(title===null)return;const partner=prompt('合作對象／成員',r.partner_name||'');if(partner===null)return;const date=prompt('合作日期 YYYY-MM-DD（可留空）',r.collaboration_date||'');if(date===null)return;const description=prompt('合作說明',r.description||'');if(description===null)return;const link=prompt('相關連結（可留空）',r.link_url||'');if(link===null)return;let image_url=r.image_url||null;if(confirm('要上傳／更換合作圖片嗎？')){const f=await chooseImage();if(f)try{image_url=await upload(f,'collabs')}catch(e){return note($('globalNotice'),'圖片上傳失敗：'+e.message,'error')}}const p={member_id:current.id,title,partner_name:partner||null,collaboration_date:date||null,description,link_url:link||null,image_url,is_published:true};const q=id?sb.from('bni_member_collaborations').update(p).eq('id',id):sb.from('bni_member_collaborations').insert(p);const {error}=await q;if(error)return note($('globalNotice'),'合作經歷儲存失敗：'+error.message,'error');note($('globalNotice'),'BNI 合作經歷已儲存。');loadCollabs()}

async function loadContacts(){const {data,error}=await sb.from('bni_member_contacts').select('*').eq('member_id',current.id).order('sort_order').order('created_at');if(error)return note($('globalNotice'),error.message,'error');$('contactList').innerHTML=data?.length?data.map(c=>`<div class="repeat-card" data-t="${c.id}"><div class="repeat-head"><div><b>${esc(c.label)}</b><div class="help">${esc(c.display_value||'')}</div></div><div class="inline-actions"><button class="btn secondary e">編輯</button><button class="btn danger d">刪除</button></div></div><div class="help">${esc(c.url||'')}</div></div>`).join(''):'<div class="empty">目前沒有聯絡方式。</div>';document.querySelectorAll('[data-t]').forEach(x=>{x.querySelector('.e').onclick=()=>editContact(x.dataset.t);x.querySelector('.d').onclick=()=>del('bni_member_contacts',x.dataset.t,loadContacts)})}
$('addContactBtn').onclick=()=>editContact();
async function editContact(id=null){let r={};if(id){const q=await sb.from('bni_member_contacts').select('*').eq('id',id).single();r=q.data||{}}const label=prompt('顯示標題，例如：預約抓漏',r.label||'');if(label===null)return;const display=prompt('第二行顯示文字，例如：官方 LINE｜@xxxx',r.display_value||'');if(display===null)return;const type=prompt('類型：phone / official_line / personal_line / instagram / facebook / website / link',r.type||'link');if(type===null)return;const url=prompt('實際連結 URL',r.url||'');if(!url)return;const p={member_id:current.id,label,display_value:display,type,url,is_published:true};const q=id?sb.from('bni_member_contacts').update(p).eq('id',id):sb.from('bni_member_contacts').insert(p);const {error}=await q;if(error)return note($('globalNotice'),'聯絡方式儲存失敗：'+error.message,'error');note($('globalNotice'),'聯絡方式已儲存。');loadContacts()}

(async()=>{if(token){showApp();await loadMembers();}else showLogin()})();
</script>
</body></html>
