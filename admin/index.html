<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>磐石建築組｜內容管理後台</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#f4f7f8;--ink:#17323d;--muted:#6c7d84;--line:#d8e3e7;--brand:#00465f;--soft:#eaf2f5;--danger:#b83c3c;--ok:#1d7a4b}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","Microsoft JhengHei",sans-serif;background:var(--bg);color:var(--ink)}button,input,textarea,select{font:inherit}button{cursor:pointer}.hidden{display:none!important}.btn{border:0;border-radius:12px;padding:11px 15px;font-weight:800}.primary{background:var(--brand);color:#fff}.secondary{background:var(--soft);color:var(--brand)}.ghost{background:#fff;border:1px solid var(--line);color:var(--ink)}.danger{background:#fff0f0;color:var(--danger);border:1px solid #f0c6c6}.login-wrap{min-height:100vh;display:grid;place-items:center;padding:24px}.login-card{width:min(440px,100%);background:#fff;border:1px solid var(--line);border-radius:22px;padding:28px;box-shadow:0 20px 60px rgba(0,70,95,.12)}.login-brand{display:flex;align-items:center;gap:12px;margin-bottom:18px}.login-brand img,.brand img{width:56px;height:56px;object-fit:cover;border-radius:14px}.login-brand h1{margin:0;font-size:24px}.status,.help{font-size:12px;color:var(--muted)}.field{display:grid;gap:7px;margin-bottom:14px}.field label{font-size:13px;font-weight:800}.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);border-radius:11px;padding:11px 12px;background:#fff;color:var(--ink)}.field input[readonly]{background:#f4f7f8;color:#51656d}.field textarea{min-height:150px;resize:vertical;line-height:1.7}.notice{padding:11px 13px;border-radius:10px;font-size:13px;margin-bottom:14px}.notice.ok{background:#eaf7f0;color:var(--ok)}.notice.error{background:#fff0f0;color:var(--danger)}.topbar{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:12px 20px}.brand{display:flex;align-items:center;gap:12px;font-weight:900}.brand img{width:46px;height:46px}.brand small{display:block;color:var(--muted);font-size:12px;font-weight:600}.layout{display:grid;grid-template-columns:300px minmax(0,1fr);min-height:calc(100vh - 71px)}.sidebar{border-right:1px solid var(--line);background:#fff;padding:18px;overflow:auto}.sidehead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}.sidehead h3{font-size:14px;margin:0;color:var(--muted)}.member-list{display:grid;gap:8px}.member-item{width:100%;text-align:left;border:1px solid var(--line);background:#fff;border-radius:12px;padding:12px}.member-item:hover,.member-item.active{border-color:#8eb6c3;background:var(--soft)}.member-item b{display:block;font-size:15px}.member-item span{font-size:12px;color:var(--muted)}.main{padding:24px;min-width:0}.page-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:18px}.page-head h1{margin:0;font-size:28px}.page-head p{margin:6px 0 0;color:var(--muted)}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}.tab{border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 13px;font-weight:800}.tab.active{background:var(--brand);color:#fff;border-color:var(--brand)}.panel{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px;margin-bottom:16px}.panel h2{font-size:19px;margin:0 0 14px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}.savebar{display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap}.repeat-list{display:grid;gap:12px}.repeat-card{border:1px solid var(--line);border-radius:14px;padding:16px;background:#fbfcfd}.repeat-head{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:12px}.inline-actions{display:flex;gap:8px;flex-wrap:wrap}.empty{border:1px dashed var(--line);border-radius:14px;padding:24px;text-align:center;color:var(--muted)}.preview-img{max-width:260px;max-height:220px;border-radius:12px;border:1px solid var(--line);object-fit:cover;margin-top:10px}.editor-box{border:1px solid #b9d0d8;background:#fbfdfe;border-radius:18px;padding:18px;margin-bottom:18px}.upload-box{border:1px dashed #aac5cf;border-radius:14px;padding:16px;background:#f8fbfc}.item-card{display:grid;grid-template-columns:160px 1fr;gap:16px}.item-card img{width:160px;height:120px;object-fit:cover;border-radius:12px;border:1px solid var(--line)}.item-card h3{margin:0 0 7px;font-size:18px}.item-card p{margin:0;white-space:pre-wrap;line-height:1.65;color:#425a64}.item-link{display:inline-block;margin-top:9px;color:var(--brand);font-weight:800;text-decoration:none}.mutedbox{background:#f5f8f9;border-radius:12px;padding:12px;color:var(--muted);font-size:13px}.section-note{font-size:13px;color:var(--muted);line-height:1.6;margin:-4px 0 14px}.full-editor-title{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}.full-editor-title h2{margin:0}.delete-armed{background:#b83c3c!important;color:#fff!important;border-color:#b83c3c!important}@media(max-width:900px){.layout{grid-template-columns:1fr}.sidebar{border-right:0;border-bottom:1px solid var(--line);max-height:300px}.grid2{grid-template-columns:1fr}.main{padding:18px}.page-head{flex-direction:column}.topbar{padding:10px 14px}.item-card{grid-template-columns:1fr}.item-card img{width:100%;height:auto;max-height:260px}}
</style>
</head>
<body>
<div id="loginView" class="login-wrap">
  <div class="login-card">
    <div class="login-brand"><img src="../logo.png" alt="Logo"><div><h1>磐石建築組</h1><div class="status">內容管理後台</div></div></div>
    <p style="color:var(--muted);line-height:1.7">使用固定管理員帳號登入。</p>
    <div id="loginNotice"></div>
    <div class="field"><label>管理員帳號</label><input id="email" value="mr.business.labb@gmail.com" readonly></div>
    <div class="field"><label>密碼</label><input id="password" type="password" autocomplete="current-password" placeholder="請輸入管理員密碼"></div>
    <button class="btn primary" id="loginBtn" style="width:100%">登入後台</button>
  </div>
</div>

<div id="appView" class="hidden">
  <div class="topbar"><div class="brand"><img src="../logo.png"><div>磐石建築組<small>內容管理後台</small></div></div><div><span class="status">mr.business.labb@gmail.com</span> <button class="btn ghost" id="logoutBtn">登出</button></div></div>
  <div class="layout">
    <aside class="sidebar">
      <div class="sidehead"><h3>建築組成員</h3><button class="btn primary" id="addMemberBtn">＋ 新增成員</button></div>
      <div id="memberList" class="member-list"></div>
    </aside>
    <main class="main">
      <div id="globalNotice"></div>

      <div id="memberEditor" class="panel hidden">
        <div class="full-editor-title"><div><h2>新增成員</h2><div class="help">直接在頁面填寫，不會跳出視窗。</div></div><button class="btn ghost" id="cancelMemberBtn">取消</button></div>
        <div class="grid2"><div class="field"><label>姓名 *</label><input id="new_name"></div><div class="field"><label>公司</label><input id="new_company"></div><div class="field"><label>職稱</label><input id="new_title"></div><div class="field"><label>一句話專業定位</label><input id="new_tagline"></div></div>
        <div class="field"><label>自我介紹</label><textarea id="new_intro" placeholder="像自我介紹一樣直接輸入，可之後再補。"></textarea></div>
        <div class="field"><label>電子名片 JSON URL</label><input id="new_card_json_url" placeholder="可留空"></div>
        <div class="savebar"><button class="btn primary" id="saveMemberBtn">建立成員</button></div>
      </div>

      <div id="editorEmpty" class="empty">請先從左側選擇一位成員，或新增成員。</div>
      <div id="editor" class="hidden">
        <div class="page-head"><div><h1 id="memberTitle"></h1><p id="memberSubtitle"></p></div><button class="btn secondary" id="refreshBtn">重新讀取</button></div>
        <div class="tabs"><button class="tab active" data-tab="basic">基本資料／自我介紹</button><button class="tab" data-tab="cases">案例</button><button class="tab" data-tab="collabs">BNI 合作經歷</button><button class="tab" data-tab="contacts">聯絡方式</button></div>

        <section id="tab-basic" class="tabpane"><div class="panel"><h2>基本資料</h2><div class="grid2"><div class="field"><label>姓名</label><input id="m_name"></div><div class="field"><label>公司</label><input id="m_company"></div><div class="field"><label>職稱</label><input id="m_title"></div><div class="field"><label>一句話專業定位</label><input id="m_tagline"></div></div><div class="field"><label>自我介紹</label><textarea id="m_intro" placeholder="像寫文章一樣直接輸入。沒有內容時，前台不顯示此區塊。"></textarea></div><div class="field"><label>電子名片 JSON URL</label><input id="m_card_json_url" placeholder="可留空"></div><div class="savebar"><button class="btn primary" id="saveBasicBtn">儲存基本資料</button></div></div></section>

        <section id="tab-cases" class="tabpane hidden"><div class="panel"><div class="repeat-head"><div><h2 style="margin:0">案例文章</h2><div class="section-note">像發 IG 貼文一樣：標題、文章內容、圖片、連結都在這裡直接填。</div></div><button class="btn primary" id="addCaseBtn">＋ 新增案例</button></div><div id="caseEditor" class="editor-box hidden"><input type="hidden" id="case_id"><div class="field"><label>文章標題</label><input id="case_title" placeholder="例如：老屋漏水改善案例"></div><div class="field"><label>文章內容</label><textarea id="case_description" placeholder="可以完整寫案例過程、問題、施工方式與成果。"></textarea></div><div class="field"><label>串連結</label><input id="case_link" placeholder="https://... 可留空"></div><div class="field"><label>案例圖片</label><div class="upload-box"><input id="case_image" type="file" accept="image/*"><div class="help">JPG、PNG、WebP、GIF，單張最大 10MB。</div><div id="caseImageCurrent"></div></div></div><div class="savebar"><button class="btn ghost" id="cancelCaseBtn">取消</button><button class="btn primary" id="saveCaseBtn">發布案例</button></div></div><div id="caseList" class="repeat-list"></div></div></section>

        <section id="tab-collabs" class="tabpane hidden"><div class="panel"><div class="repeat-head"><div><h2 style="margin:0">BNI 合作經歷</h2><div class="section-note">合作資料也直接在頁面填寫，不使用跳出視窗。</div></div><button class="btn primary" id="addCollabBtn">＋ 新增合作經歷</button></div><div id="collabEditor" class="editor-box hidden"><input type="hidden" id="collab_id"><div class="grid2"><div class="field"><label>合作標題</label><input id="collab_title" placeholder="例如：與油漆夥伴協作"></div><div class="field"><label>合作對象／成員</label><input id="collab_partner" placeholder="可留空"></div><div class="field"><label>合作日期</label><input id="collab_date" type="date"></div><div class="field"><label>相關連結</label><input id="collab_link" placeholder="https://... 可留空"></div></div><div class="field"><label>合作內容</label><textarea id="collab_description" placeholder="直接寫合作過程、分工、成果或轉介紹內容。"></textarea></div><div class="field"><label>合作圖片</label><div class="upload-box"><input id="collab_image" type="file" accept="image/*"><div class="help">可留空；需要時再上傳。</div><div id="collabImageCurrent"></div></div></div><div class="savebar"><button class="btn ghost" id="cancelCollabBtn">取消</button><button class="btn primary" id="saveCollabBtn">儲存合作經歷</button></div></div><div id="collabList" class="repeat-list"></div></div></section>

        <section id="tab-contacts" class="tabpane hidden"><div class="panel"><div class="repeat-head"><div><h2 style="margin:0">聯絡方式</h2><div class="section-note">所有聯絡資料都在頁面內直接編輯。</div></div><button class="btn primary" id="addContactBtn">＋ 新增聯絡方式</button></div><div id="contactEditor" class="editor-box hidden"><input type="hidden" id="contact_id"><div class="grid2"><div class="field"><label>顯示標題</label><input id="contact_label" placeholder="例如：預約抓漏"></div><div class="field"><label>第二行文字</label><input id="contact_display" placeholder="例如：官方 LINE｜@xxxx"></div><div class="field"><label>類型</label><select id="contact_type"><option value="phone">電話</option><option value="official_line">官方 LINE</option><option value="personal_line">個人 LINE</option><option value="instagram">Instagram</option><option value="facebook">Facebook</option><option value="website">網站</option><option value="link">其他連結</option></select></div><div class="field"><label>實際連結 URL</label><input id="contact_url" placeholder="tel:... 或 https://..."></div></div><div class="savebar"><button class="btn ghost" id="cancelContactBtn">取消</button><button class="btn primary" id="saveContactBtn">儲存聯絡方式</button></div></div><div id="contactList" class="repeat-list"></div></div></section>
      </div>
    </main>
  </div>
</div>

<script>
const U='https://packaiwgsswrjvxdsejw.supabase.co';
const K='sb_publishable_Jrp7cxW-ppSJtrk-lScZjA_blNEnBRG';
const EMAIL='mr.business.labb@gmail.com';
const base=supabase.createClient(U,K,{auth:{persistSession:false}});
let sb=null,token=localStorage.getItem('bni_admin_token')||'',members=[],current=null,currentCaseImage='',currentCollabImage='';
const $=id=>document.getElementById(id);
const esc=(v='')=>String(v).replace(/[&<>"']/g,s=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[s]));
const note=(el,msg,type='ok')=>el.innerHTML=msg?`<div class="notice ${type}">${esc(msg)}</div>`:'';
async function sha256(s){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
function makeAdminClient(){sb=supabase.createClient(U,K,{auth:{persistSession:false},global:{headers:{'x-bni-admin-token':token}}})}
function showApp(){makeAdminClient();$('loginView').classList.add('hidden');$('appView').classList.remove('hidden')}
function showTab(name){document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.tab===name));document.querySelectorAll('.tabpane').forEach(x=>x.classList.add('hidden'));$('tab-'+name).classList.remove('hidden')}

$('loginBtn').onclick=async()=>{note($('loginNotice'),'');const pw=$('password').value;if(!pw)return note($('loginNotice'),'請輸入密碼。','error');$('loginBtn').disabled=true;$('loginBtn').textContent='登入中…';try{const hash=await sha256(pw);const {data,error}=await base.rpc('bni_admin_login',{p_email:EMAIL,p_password_sha256:hash});if(error||!data){note($('loginNotice'),'帳號或密碼錯誤。','error');return}token=data;localStorage.setItem('bni_admin_token',token);$('password').value='';showApp();await loadMembers()}catch(e){note($('loginNotice'),'登入失敗：'+e.message,'error')}finally{$('loginBtn').disabled=false;$('loginBtn').textContent='登入後台'}};
$('password').addEventListener('keydown',e=>{if(e.key==='Enter')$('loginBtn').click()});
$('logoutBtn').onclick=async()=>{try{await base.rpc('bni_admin_logout',{p_token:token})}catch{}localStorage.removeItem('bni_admin_token');location.reload()};
$('refreshBtn').onclick=()=>current&&selectMember(current.id);

function slugify(name){return 'member-'+Date.now()+'-'+String(name||'').trim().toLowerCase().replace(/\s+/g,'-').replace(/[^a-z0-9\u4e00-\u9fff-]/g,'').slice(0,28)}
async function loadMembers(){const {data,error}=await sb.from('bni_members').select('*').order('sort_order').order('created_at');if(error)return note($('globalNotice'),'讀取成員失敗：'+error.message,'error');members=data||[];$('memberList').innerHTML=members.map(m=>`<button class="member-item ${current?.id===m.id?'active':''}" data-id="${m.id}"><b>${esc(m.name)}</b><span>${esc(m.company||'')}</span></button>`).join('');document.querySelectorAll('.member-item').forEach(b=>b.onclick=()=>selectMember(b.dataset.id))}
async function selectMember(id){current=members.find(x=>x.id===id);if(!current)return;$('memberEditor').classList.add('hidden');$('editorEmpty').classList.add('hidden');$('editor').classList.remove('hidden');document.querySelectorAll('.member-item').forEach(x=>x.classList.toggle('active',x.dataset.id===id));$('memberTitle').textContent=current.name;$('memberSubtitle').textContent=current.company||'';['name','company','title','tagline','intro','card_json_url'].forEach(k=>$('m_'+k).value=current[k]||'');hideCaseEditor();hideCollabEditor();hideContactEditor();await Promise.all([loadCases(),loadCollabs(),loadContacts()])}
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>showTab(t.dataset.tab));

$('addMemberBtn').onclick=()=>{current=null;document.querySelectorAll('.member-item').forEach(x=>x.classList.remove('active'));$('editor').classList.add('hidden');$('editorEmpty').classList.add('hidden');$('memberEditor').classList.remove('hidden');$('memberEditor').scrollIntoView({behavior:'smooth',block:'start'})};
$('cancelMemberBtn').onclick=()=>{$('memberEditor').classList.add('hidden');$('editorEmpty').classList.remove('hidden')};
$('saveMemberBtn').onclick=async()=>{const name=$('new_name').value.trim();if(!name)return note($('globalNotice'),'請輸入成員姓名。','error');const maxSort=members.reduce((m,x)=>Math.max(m,Number(x.sort_order)||0),0);const p={slug:slugify(name),name,company:$('new_company').value.trim()||null,title:$('new_title').value.trim()||null,tagline:$('new_tagline').value.trim()||null,intro:$('new_intro').value.trim()||null,card_json_url:$('new_card_json_url').value.trim()||null,sort_order:maxSort+1,is_published:true};const {data,error}=await sb.from('bni_members').insert(p).select().single();if(error)return note($('globalNotice'),'新增成員失敗：'+error.message,'error');['new_name','new_company','new_title','new_tagline','new_intro','new_card_json_url'].forEach(id=>$(id).value='');note($('globalNotice'),'成員已新增。');await loadMembers();await selectMember(data.id)};

$('saveBasicBtn').onclick=async()=>{const p={name:$('m_name').value.trim(),company:$('m_company').value.trim(),title:$('m_title').value.trim(),tagline:$('m_tagline').value.trim(),intro:$('m_intro').value.trim(),card_json_url:$('m_card_json_url').value.trim()||null};const {data,error}=await sb.from('bni_members').update(p).eq('id',current.id).select().single();if(error)return note($('globalNotice'),'儲存失敗：'+error.message,'error');current=data;members=members.map(x=>x.id===data.id?data:x);$('memberTitle').textContent=data.name;$('memberSubtitle').textContent=data.company||'';note($('globalNotice'),'基本資料已儲存。');await loadMembers()};

async function upload(file,kind){if(!file)return null;const ext=(file.name.split('.').pop()||'jpg').toLowerCase(),path=`${current.slug}/${kind}/${Date.now()}-${Math.random().toString(36).slice(2,8)}.${ext}`;const {error}=await sb.storage.from('bni-building-media').upload(path,file,{contentType:file.type||undefined});if(error)throw error;return sb.storage.from('bni-building-media').getPublicUrl(path).data.publicUrl}
function armDelete(btn,table,id,reload){if(btn.dataset.armed==='1'){deleteRow(table,id,reload);return}btn.dataset.armed='1';btn.classList.add('delete-armed');btn.textContent='再按一次刪除';setTimeout(()=>{btn.dataset.armed='0';btn.classList.remove('delete-armed');btn.textContent='刪除'},4000)}
async function deleteRow(table,id,reload){const {error}=await sb.from(table).delete().eq('id',id);if(error)return note($('globalNotice'),'刪除失敗：'+error.message,'error');note($('globalNotice'),'已刪除。');await reload()}

function hideCaseEditor(){$('caseEditor').classList.add('hidden');$('case_id').value='';$('case_title').value='';$('case_description').value='';$('case_link').value='';$('case_image').value='';$('caseImageCurrent').innerHTML='';currentCaseImage=''}
function showCaseEditor(r={}){$('caseEditor').classList.remove('hidden');$('case_id').value=r.id||'';$('case_title').value=r.title||'';$('case_description').value=r.description||'';$('case_link').value=r.link_url||'';$('case_image').value='';currentCaseImage=r.image_url||'';$('caseImageCurrent').innerHTML=currentCaseImage?`<div class="help" style="margin-top:8px">目前圖片</div><img class="preview-img" src="${esc(currentCaseImage)}">`:'';$('saveCaseBtn').textContent=r.id?'儲存修改':'發布案例';$('caseEditor').scrollIntoView({behavior:'smooth',block:'start'})}
$('addCaseBtn').onclick=()=>showCaseEditor();$('cancelCaseBtn').onclick=hideCaseEditor;
async function loadCases(){const {data,error}=await sb.from('bni_member_cases').select('*').eq('member_id',current.id).order('sort_order').order('created_at',{ascending:false});if(error)return note($('globalNotice'),'讀取案例失敗：'+error.message,'error');$('caseList').innerHTML=data?.length?data.map(c=>`<div class="repeat-card item-card" data-c="${c.id}">${c.image_url?`<img src="${esc(c.image_url)}">`:'<div class="mutedbox">沒有圖片</div>'}<div><div class="repeat-head"><h3>${esc(c.title)}</h3><div class="inline-actions"><button class="btn secondary e">編輯</button><button class="btn danger d">刪除</button></div></div><p>${esc(c.description||'')}</p>${c.link_url?`<a class="item-link" href="${esc(c.link_url)}" target="_blank" rel="noopener">開啟連結 ↗</a>`:''}</div></div>`).join(''):'<div class="empty">目前沒有案例。</div>';document.querySelectorAll('[data-c]').forEach(x=>{x.querySelector('.e').onclick=async()=>{const q=await sb.from('bni_member_cases').select('*').eq('id',x.dataset.c).single();if(q.data)showCaseEditor(q.data)};x.querySelector('.d').onclick=e=>armDelete(e.currentTarget,'bni_member_cases',x.dataset.c,loadCases)})}
$('saveCaseBtn').onclick=async()=>{const id=$('case_id').value,title=$('case_title').value.trim(),description=$('case_description').value.trim(),link_url=$('case_link').value.trim()||null;if(!title)return note($('globalNotice'),'案例需要文章標題。','error');let image_url=currentCaseImage||null;const file=$('case_image').files?.[0];if(file){try{$('saveCaseBtn').disabled=true;$('saveCaseBtn').textContent='上傳圖片中…';image_url=await upload(file,'cases')}catch(e){$('saveCaseBtn').disabled=false;return note($('globalNotice'),'圖片上傳失敗：'+e.message,'error')}}const p={member_id:current.id,title,description:description||null,link_url,image_url,is_published:true};const q=id?sb.from('bni_member_cases').update(p).eq('id',id):sb.from('bni_member_cases').insert(p);const {error}=await q;$('saveCaseBtn').disabled=false;if(error)return note($('globalNotice'),'案例儲存失敗：'+error.message,'error');note($('globalNotice'),id?'案例已更新。':'案例已發布。');hideCaseEditor();await loadCases()};

function hideCollabEditor(){$('collabEditor').classList.add('hidden');$('collab_id').value='';$('collab_title').value='';$('collab_partner').value='';$('collab_date').value='';$('collab_link').value='';$('collab_description').value='';$('collab_image').value='';$('collabImageCurrent').innerHTML='';currentCollabImage=''}
function showCollabEditor(r={}){$('collabEditor').classList.remove('hidden');$('collab_id').value=r.id||'';$('collab_title').value=r.title||'';$('collab_partner').value=r.partner_name||'';$('collab_date').value=r.collaboration_date||'';$('collab_link').value=r.link_url||'';$('collab_description').value=r.description||'';$('collab_image').value='';currentCollabImage=r.image_url||'';$('collabImageCurrent').innerHTML=currentCollabImage?`<div class="help" style="margin-top:8px">目前圖片</div><img class="preview-img" src="${esc(currentCollabImage)}">`:'';$('saveCollabBtn').textContent=r.id?'儲存修改':'儲存合作經歷';$('collabEditor').scrollIntoView({behavior:'smooth',block:'start'})}
$('addCollabBtn').onclick=()=>showCollabEditor();$('cancelCollabBtn').onclick=hideCollabEditor;
async function loadCollabs(){const {data,error}=await sb.from('bni_member_collaborations').select('*').eq('member_id',current.id).order('sort_order').order('created_at',{ascending:false});if(error)return note($('globalNotice'),'讀取合作經歷失敗：'+error.message,'error');$('collabList').innerHTML=data?.length?data.map(c=>`<div class="repeat-card item-card" data-b="${c.id}">${c.image_url?`<img src="${esc(c.image_url)}">`:'<div class="mutedbox">沒有圖片</div>'}<div><div class="repeat-head"><div><h3>${esc(c.title)}</h3><div class="help">${esc(c.partner_name||'')}${c.collaboration_date?'｜'+esc(c.collaboration_date):''}</div></div><div class="inline-actions"><button class="btn secondary e">編輯</button><button class="btn danger d">刪除</button></div></div><p>${esc(c.description||'')}</p>${c.link_url?`<a class="item-link" href="${esc(c.link_url)}" target="_blank" rel="noopener">開啟連結 ↗</a>`:''}</div></div>`).join(''):'<div class="empty">目前沒有 BNI 合作經歷。</div>';document.querySelectorAll('[data-b]').forEach(x=>{x.querySelector('.e').onclick=async()=>{const q=await sb.from('bni_member_collaborations').select('*').eq('id',x.dataset.b).single();if(q.data)showCollabEditor(q.data)};x.querySelector('.d').onclick=e=>armDelete(e.currentTarget,'bni_member_collaborations',x.dataset.b,loadCollabs)})}
$('saveCollabBtn').onclick=async()=>{const id=$('collab_id').value,title=$('collab_title').value.trim();if(!title)return note($('globalNotice'),'請輸入合作標題。','error');let image_url=currentCollabImage||null;const file=$('collab_image').files?.[0];if(file){try{$('saveCollabBtn').disabled=true;$('saveCollabBtn').textContent='上傳圖片中…';image_url=await upload(file,'collabs')}catch(e){$('saveCollabBtn').disabled=false;return note($('globalNotice'),'圖片上傳失敗：'+e.message,'error')}}const p={member_id:current.id,title,partner_name:$('collab_partner').value.trim()||null,collaboration_date:$('collab_date').value||null,description:$('collab_description').value.trim()||null,link_url:$('collab_link').value.trim()||null,image_url,is_published:true};const q=id?sb.from('bni_member_collaborations').update(p).eq('id',id):sb.from('bni_member_collaborations').insert(p);const {error}=await q;$('saveCollabBtn').disabled=false;if(error)return note($('globalNotice'),'合作經歷儲存失敗：'+error.message,'error');note($('globalNotice'),id?'合作經歷已更新。':'合作經歷已新增。');hideCollabEditor();await loadCollabs()};

function hideContactEditor(){$('contactEditor').classList.add('hidden');$('contact_id').value='';$('contact_label').value='';$('contact_display').value='';$('contact_type').value='link';$('contact_url').value=''}
function showContactEditor(r={}){$('contactEditor').classList.remove('hidden');$('contact_id').value=r.id||'';$('contact_label').value=r.label||'';$('contact_display').value=r.display_value||'';$('contact_type').value=r.type||'link';$('contact_url').value=r.url||'';$('saveContactBtn').textContent=r.id?'儲存修改':'儲存聯絡方式';$('contactEditor').scrollIntoView({behavior:'smooth',block:'start'})}
$('addContactBtn').onclick=()=>showContactEditor();$('cancelContactBtn').onclick=hideContactEditor;
async function loadContacts(){const {data,error}=await sb.from('bni_member_contacts').select('*').eq('member_id',current.id).order('sort_order').order('created_at');if(error)return note($('globalNotice'),'讀取聯絡方式失敗：'+error.message,'error');$('contactList').innerHTML=data?.length?data.map(c=>`<div class="repeat-card" data-t="${c.id}"><div class="repeat-head"><div><b>${esc(c.label)}</b><div class="help">${esc(c.display_value||'')}</div><div class="help" style="margin-top:4px">${esc(c.url)}</div></div><div class="inline-actions"><button class="btn secondary e">編輯</button><button class="btn danger d">刪除</button></div></div></div>`).join(''):'<div class="empty">目前沒有聯絡方式。</div>';document.querySelectorAll('[data-t]').forEach(x=>{x.querySelector('.e').onclick=async()=>{const q=await sb.from('bni_member_contacts').select('*').eq('id',x.dataset.t).single();if(q.data)showContactEditor(q.data)};x.querySelector('.d').onclick=e=>armDelete(e.currentTarget,'bni_member_contacts',x.dataset.t,loadContacts)})}
$('saveContactBtn').onclick=async()=>{const id=$('contact_id').value,label=$('contact_label').value.trim(),url=$('contact_url').value.trim();if(!label)return note($('globalNotice'),'請輸入顯示標題。','error');if(!url)return note($('globalNotice'),'請輸入實際連結 URL。','error');const p={member_id:current.id,label,display_value:$('contact_display').value.trim()||null,type:$('contact_type').value||'link',url,is_published:true};const q=id?sb.from('bni_member_contacts').update(p).eq('id',id):sb.from('bni_member_contacts').insert(p);const {error}=await q;if(error)return note($('globalNotice'),'聯絡方式儲存失敗：'+error.message,'error');note($('globalNotice'),id?'聯絡方式已更新。':'聯絡方式已新增。');hideContactEditor();await loadContacts()};

(async()=>{if(token){showApp();await loadMembers()}})();
</script>
