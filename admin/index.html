<script>
const U='https://packaiwgsswrjvxdsejw.supabase.co',K='sb_publishable_Jrp7cxW-ppSJtrk-lScZjA_blNEnBRG',EMAIL='mr.business.labb@gmail.com';
const base=supabase.createClient(U,K,{auth:{persistSession:false}});let sb=null,token=localStorage.getItem('bni_admin_token')||'',members=[],current=null,currentCaseImage='',currentCollabImage='';const $=id=>document.getElementById(id);const esc=(v='')=>String(v).replace(/[&<>"']/g,s=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[s]));const note=(el,msg,type='ok')=>el.innerHTML=msg?`<div class="notice ${type}">${esc(msg)}</div>`:'';
const PROBLEMS=[['water','漏水／防水'],['renovation','老屋翻修'],['paint','油漆翻新'],['electric','水電工程'],['commercial','商空／辦公室']];const ROLES=[['planning_gc','統包／整體工程'],['planning_design','室內／空間設計'],['planning_architect','建築規劃'],['demolition','拆除清運'],['masonry','泥作'],['leak_detection','漏水檢測'],['inspection','工程檢測'],['waterproof_masonry','防水修繕'],['plumbing','水電施工'],['electrical','電氣工程'],['low_voltage','弱電工程'],['mep','機電／消防／儀控'],['green_energy','綠電／能源設備'],['smart_lighting','智慧照明'],['woodwork','木作'],['flooring','木地板'],['kitchen','廚房／廚具'],['painting','油漆工程']];
function hasAny(s,words){return words.some(w=>s.includes(w))}function analyzeText(text){const s=String(text||'').toLowerCase(),p=new Set(),r=new Set();const add=(ps,rs)=>{ps.forEach(x=>p.add(x));rs.forEach(x=>r.add(x))};
if(hasAny(s,['抓漏','漏水','滲水','壁癌','防水','止漏']))add(['water','renovation','commercial'],['leak_detection','waterproof_masonry']);if(hasAny(s,['工程檢測','非破壞','熱顯像','紅外線','防蝕','檢測']))add(['water','commercial'],['inspection']);if(hasAny(s,['水電','水管','給排水','衛浴','配管']))add(['electric','renovation','commercial','water'],['plumbing','electrical']);if(hasAny(s,['弱電','監視器','網路','門禁','對講','資訊']))add(['electric','renovation','commercial'],['low_voltage']);if(hasAny(s,['機電','消防','儀控','環控','泵浦']))add(['electric','renovation','commercial'],['mep','electrical']);if(hasAny(s,['綠電','太陽能','光電','儲能','能源']))add(['electric','commercial'],['green_energy','electrical']);if(hasAny(s,['照明','燈光','智能','智慧家庭','智慧控制']))add(['electric','renovation','commercial'],['smart_lighting']);if(hasAny(s,['拆除','清運','鷹架']))add(['renovation','commercial'],['demolition']);if(hasAny(s,['泥作','砌磚','磁磚','打底','粉光']))add(['renovation','water','commercial'],['masonry']);if(hasAny(s,['油漆','粉刷','藝術漆','塗裝','牆面翻新']))add(['paint','renovation','water','commercial'],['painting']);if(hasAny(s,['木作','系統櫃','櫃體','天花板']))add(['renovation','commercial'],['woodwork']);if(hasAny(s,['地板','木地板','塑膠地板','超耐磨']))add(['renovation','commercial'],['flooring']);if(hasAny(s,['廚房','廚具','流理台','櫥櫃']))add(['renovation','commercial'],['kitchen']);if(hasAny(s,['室內設計','空間設計','設計裝修','商業空間設計']))add(['renovation','commercial'],['planning_design']);if(hasAny(s,['建築師','建築設計','監造','建築規劃']))add(['renovation','commercial'],['planning_architect']);if(hasAny(s,['統包','整體工程','裝修統包','工程管理']))add(['renovation','commercial'],['planning_gc']);if(hasAny(s,['冷氣','空調','空調設備','冷凍空調']))add(['renovation','commercial','electric'],['mep','electrical']);if(hasAny(s,['商空','店面','辦公室','商業空間']))p.add('commercial');if(hasAny(s,['老屋','翻修','裝修','裝潢','改造','住宅修繕']))p.add('renovation');return{problems:[...p],roles:[...r]}}
function labels(vals,opts){return vals.map(v=>opts.find(x=>x[0]===v)?.[1]||v)}function renderAnalysis(id,a){const ps=labels(a.problems,PROBLEMS),rs=labels(a.roles,ROLES);$(id).innerHTML=`<b>系統判斷：</b><div class="chips" style="margin-top:8px">${[...ps,...rs].map(x=>`<span class="chip">${esc(x)}</span>`).join('')||'<span class="help">目前資料不足，請多補一些服務內容或常見問題。</span>'}</div>`}
function renderManual(id,prefix,problems=[],roles=[]){$(id).innerHTML=`<div class="help" style="margin-top:10px">只有系統判斷不準時才需要手動調整。</div><div class="group-label">問題分類</div><div class="check-grid">${PROBLEMS.map(([v,l])=>`<label class="check-item"><input type="checkbox" data-${prefix}-p value="${v}" ${problems.includes(v)?'checked':''}><span>${l}</span></label>`).join('')}</div><div class="group-label" style="margin-top:12px">流程角色</div><div class="check-grid">${ROLES.map(([v,l])=>`<label class="check-item"><input type="checkbox" data-${prefix}-r value="${v}" ${roles.includes(v)?'checked':''}><span>${l}</span></label>`).join('')}</div>`}function checked(prefix,kind){return [...document.querySelectorAll(`[data-${prefix}-${kind}]`)].filter(x=>x.checked).map(x=>x.value)}function setChecks(prefix,a){document.querySelectorAll(`[data-${prefix}-p]`).forEach(x=>x.checked=a.problems.includes(x.value));document.querySelectorAll(`[data-${prefix}-r]`).forEach(x=>x.checked=a.roles.includes(x.value))}
function textFor(prefix){return [$(prefix+'_expertise').value,$(prefix+'_services').value,$(prefix+'_problems_text').value,$(prefix+'_work_scope').value,$(prefix==='m'?'m_tagline':'new_tagline').value].join(' ')}function runAnalysis(prefix){const a=analyzeText(textFor(prefix));renderAnalysis(prefix==='m'?'editAnalysis':'newAnalysis',a);setChecks(prefix==='m'?'edit':'new',a);return a}
async function sha256(s){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}function makeClient(){sb=supabase.createClient(U,K,{auth:{persistSession:false},global:{headers:{'x-bni-admin-token':token}}})}function showApp(){makeClient();$('loginView').classList.add('hidden');$('appView').classList.remove('hidden')}function slugify(name){return 'member-'+Date.now()+'-'+String(name).trim().toLowerCase().replace(/\s+/g,'-').replace(/[^a-z0-9\u4e00-\u9fff-]/g,'').slice(0,28)}
$('loginBtn').onclick=async()=>{const pw=$('password').value;if(!pw)return note($('loginNotice'),'請輸入密碼。','error');const hash=await sha256(pw),{data,error}=await base.rpc('bni_admin_login',{p_email:EMAIL,p_password_sha256:hash});if(error||!data)return note($('loginNotice'),'帳號或密碼錯誤。','error');token=data;localStorage.setItem('bni_admin_token',token);showApp();await loadMembers()};$('password').onkeydown=e=>{if(e.key==='Enter')$('loginBtn').click()};$('logoutBtn').onclick=async()=>{try{await base.rpc('bni_admin_logout',{p_token:token})}catch{}localStorage.removeItem('bni_admin_token');location.reload()};$('refreshBtn').onclick=()=>current&&selectMember(current.id);
async function loadMembers(){const {data,error}=await sb.from('bni_members').select('*').order('sort_order').order('created_at');if(error)return note($('globalNotice'),'讀取成員失敗：'+error.message,'error');members=data||[];$('memberList').innerHTML=members.map(m=>`<button class="member-item ${current?.id===m.id?'active':''}" data-id="${m.id}"><b>${esc(m.name)}</b><span>${esc(m.company||'')}</span></button>`).join('');document.querySelectorAll('.member-item').forEach(b=>b.onclick=()=>selectMember(b.dataset.id))}
async function selectMember(id){current=members.find(x=>x.id===id);if(!current)return;$('memberEditor').classList.add('hidden');$('editorEmpty').classList.add('hidden');$('editor').classList.remove('hidden');document.querySelectorAll('.member-item').forEach(x=>x.classList.toggle('active',x.dataset.id===id));$('memberTitle').textContent=current.name;$('memberSubtitle').textContent=current.company||'';const map={name:'name',company:'company',title:'title',tagline:'tagline',intro:'intro',card_json_url:'card_json_url',expertise:'expertise_category',services:'services',problems_text:'common_problems',work_scope:'work_scope'};Object.entries(map).forEach(([id2,k])=>$('m_'+id2).value=current[k]||'');renderManual('editManual','edit',current.problem_keys||[],current.role_keys||[]);renderAnalysis('editAnalysis',{problems:current.problem_keys||[],roles:current.role_keys||[]});hideCaseEditor();hideCollabEditor();hideContactEditor();await Promise.all([loadCases(),loadCollabs(),loadContacts()])}
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===t));document.querySelectorAll('.tabpane').forEach(x=>x.classList.add('hidden'));$('tab-'+t.dataset.tab).classList.remove('hidden')});
$('addMemberBtn').onclick=()=>{current=null;$('editor').classList.add('hidden');$('editorEmpty').classList.add('hidden');$('memberEditor').classList.remove('hidden');renderManual('newManual','new',[],[]);renderAnalysis('newAnalysis',{problems:[],roles:[]})};$('cancelMemberBtn').onclick=()=>{$('memberEditor').classList.add('hidden');$('editorEmpty').classList.remove('hidden')};$('analyzeNewBtn').onclick=()=>runAnalysis('new');$('analyzeEditBtn').onclick=()=>runAnalysis('m');
$('saveMemberBtn').onclick=async()=>{const name=$('new_name').value.trim();if(!name)return note($('globalNotice'),'請輸入成員姓名。','error');const a=runAnalysis('new'),manualP=checked('new','p'),manualR=checked('new','r'),p={slug:slugify(name),name,company:$('new_company').value.trim()||null,title:$('new_title').value.trim()||null,tagline:$('new_tagline').value.trim()||null,intro:$('new_intro').value.trim()||null,card_json_url:$('new_card_json_url').value.trim()||null,expertise_category:$('new_expertise').value.trim()||null,services:$('new_services').value.trim()||null,common_problems:$('new_problems_text').value.trim()||null,work_scope:$('new_work_scope').value.trim()||null,problem_keys:manualP.length?manualP:a.problems,role_keys:manualR.length?manualR:a.roles,sort_order:members.reduce((m,x)=>Math.max(m,Number(x.sort_order)||0),0)+1,is_published:true};const {data,error}=await sb.from('bni_members').insert(p).select().single();if(error)return note($('globalNotice'),'新增成員失敗：'+error.message,'error');note($('globalNotice'),'成員已新增，系統已完成前台分配。');await loadMembers();await selectMember(data.id)};
$('saveBasicBtn').onclick=async()=>{const a=runAnalysis('m'),manualP=checked('edit','p'),manualR=checked('edit','r'),p={name:$('m_name').value.trim(),company:$('m_company').value.trim(),title:$('m_title').value.trim(),tagline:$('m_tagline').value.trim(),intro:$('m_intro').value.trim(),card_json_url:$('m_card_json_url').value.trim()||null,expertise_category:$('m_expertise').value.trim()||null,services:$('m_services').value.trim()||null,common_problems:$('m_problems_text').value.trim()||null,work_scope:$('m_work_scope').value.trim()||null,problem_keys:manualP.length?manualP:a.problems,role_keys:manualR.length?manualR:a.roles};const {data,error}=await sb.from('bni_members').update(p).eq('id',current.id).select().single();if(error)return note($('globalNotice'),'儲存失敗：'+error.message,'error');current=data;members=members.map(x=>x.id===data.id?data:x);note($('globalNotice'),'基本資料已儲存，前台分配已同步更新。');await loadMembers()};
async function upload(file,kind){if(!file)return null;const ext=(file.name.split('.').pop()||'jpg').toLowerCase(),path=`${current.slug}/${kind}/${Date.now()}-${Math.random().toString(36).slice(2,8)}.${ext}`;const {error}=await sb.storage.from('bni-building-media').upload(path,file,{contentType:file.type||undefined});if(error)throw error;return sb.storage.from('bni-building-media').getPublicUrl(path).data.publicUrl}function armDelete(btn,table,id,reload){if(btn.dataset.armed==='1'){deleteRow(table,id,reload);return}btn.dataset.armed='1';btn.classList.add('delete-armed');btn.textContent='再按一次刪除';setTimeout(()=>{btn.dataset.armed='0';btn.classList.remove('delete-armed');btn.textContent='刪除'},4000)}async function deleteRow(table,id,reload){const {error}=await sb.from(table).delete().eq('id',id);if(error)return note($('globalNotice'),'刪除失敗：'+error.message,'error');await reload()}
function hideCaseEditor(){$('caseEditor').classList.add('hidden');['case_id','case_title','case_description','case_link'].forEach(x=>$(x).value='');$('case_image').value='';$('caseImageCurrent').innerHTML='';currentCaseImage=''}function showCaseEditor(r={}){$('caseEditor').classList.remove('hidden');$('case_id').value=r.id||'';$('case_title').value=r.title||'';$('case_description').value=r.description||'';$('case_link').value=r.link_url||'';currentCaseImage=r.image_url||'';$('caseImageCurrent').innerHTML=currentCaseImage?`<img class="preview-img" src="${esc(currentCaseImage)}">`:'';$('saveCaseBtn').textContent=r.id?'儲存修改':'發布案例'}$('addCaseBtn').onclick=()=>showCaseEditor();$('cancelCaseBtn').onclick=hideCaseEditor;async function loadCases(){const {data}=await sb.from('bni_member_cases').select('*').eq('member_id',current.id).order('sort_order').order('created_at',{ascending:false});$('caseList').innerHTML=data?.length?data.map(c=>`<div class="repeat-card item-card" data-c="${c.id}">${c.image_url?`<img src="${esc(c.image_url)}">`:'<div class="mutedbox">沒有圖片</div>'}<div><div class="repeat-head"><h3>${esc(c.title)}</h3><div class="inline-actions"><button class="btn secondary e">編輯</button><button class="btn danger d">刪除</button></div></div><p>${esc(c.description||'')}</p>${c.link_url?`<a class="item-link" href="${esc(c.link_url)}" target="_blank">開啟連結 ↗</a>`:''}</div></div>`).join(''):'<div class="empty">目前沒有案例。</div>';document.querySelectorAll('[data-c]').forEach(x=>{x.querySelector('.e').onclick=async()=>{const q=await sb.from('bni_member_cases').select('*').eq('id',x.dataset.c).single();if(q.data)showCaseEditor(q.data)};x.querySelector('.d').onclick=e=>armDelete(e.currentTarget,'bni_member_cases',x.dataset.c,loadCases)})}$('saveCaseBtn').onclick=async()=>{const id=$('case_id').value,title=$('case_title').value.trim();if(!title)return note($('globalNotice'),'案例需要文章標題。','error');let image_url=currentCaseImage||null,file=$('case_image').files?.[0];if(file)image_url=await upload(file,'cases');const p={member_id:current.id,title,description:$('case_description').value.trim()||null,link_url:$('case_link').value.trim()||null,image_url,is_published:true},q=id?sb.from('bni_member_cases').update(p).eq('id',id):sb.from('bni_member_cases').insert(p),{error}=await q;if(error)return note($('globalNotice'),'案例儲存失敗：'+error.message,'error');hideCaseEditor();await loadCases()};
function hideCollabEditor(){$('collabEditor').classList.add('hidden');['collab_id','collab_title','collab_partner','collab_date','collab_link','collab_description'].forEach(x=>$(x).value='');$('collab_image').value='';$('collabImageCurrent').innerHTML='';currentCollabImage=''}function showCollabEditor(r={}){$('collabEditor').classList.remove('hidden');$('collab_id').value=r.id||'';$('collab_title').value=r.title||'';$('collab_partner').value=r.partner_name||'';$('collab_date').value=r.collaboration_date||'';$('collab_link').value=r.link_url||'';$('collab_description').value=r.description||'';currentCollabImage=r.image_url||'';$('collabImageCurrent').innerHTML=currentCollabImage?`<img class="preview-img" src="${esc(currentCollabImage)}">`:''}$('addCollabBtn').onclick=()=>showCollabEditor();$('cancelCollabBtn').onclick=hideCollabEditor;async function loadCollabs(){const {data}=await sb.from('bni_member_collaborations').select('*').eq('member_id',current.id).order('sort_order').order('created_at',{ascending:false});$('collabList').innerHTML=data?.length?data.map(c=>`<div class="repeat-card item-card" data-b="${c.id}">${c.image_url?`<img src="${esc(c.image_url)}">`:'<div class="mutedbox">沒有圖片</div>'}<div><div class="repeat-head"><h3>${esc(c.title)}</h3><div class="inline-actions"><button class="btn secondary e">編輯</button><button class="btn danger d">刪除</button></div></div><p>${esc(c.description||'')}</p></div></div>`).join(''):'<div class="empty">目前沒有 BNI 合作經歷。</div>';document.querySelectorAll('[data-b]').forEach(x=>{x.querySelector('.e').onclick=async()=>{const q=await sb.from('bni_member_collaborations').select('*').eq('id',x.dataset.b).single();if(q.data)showCollabEditor(q.data)};x.querySelector('.d').onclick=e=>armDelete(e.currentTarget,'bni_member_collaborations',x.dataset.b,loadCollabs)})}$('saveCollabBtn').onclick=async()=>{const id=$('collab_id').value,title=$('collab_title').value.trim();if(!title)return note($('globalNotice'),'請輸入合作標題。','error');let image_url=currentCollabImage||null,file=$('collab_image').files?.[0];if(file)image_url=await upload(file,'collabs');const p={member_id:current.id,title,partner_name:$('collab_partner').value.trim()||null,collaboration_date:$('collab_date').value||null,description:$('collab_description').value.trim()||null,link_url:$('collab_link').value.trim()||null,image_url,is_published:true},q=id?sb.from('bni_member_collaborations').update(p).eq('id',id):sb.from('bni_member_collaborations').insert(p),{error}=await q;if(error)return note($('globalNotice'),'合作經歷儲存失敗：'+error.message,'error');hideCollabEditor();await loadCollabs()};
function hideContactEditor(){$('contactEditor').classList.add('hidden');['contact_id','contact_label','contact_display','contact_url'].forEach(x=>$(x).value='');$('contact_type').value='link'}function showContactEditor(r={}){$('contactEditor').classList.remove('hidden');$('contact_id').value=r.id||'';$('contact_label').value=r.label||'';$('contact_display').value=r.display_value||'';$('contact_type').value=r.type||'link';$('contact_url').value=r.url||''}$('addContactBtn').onclick=()=>showContactEditor();$('cancelContactBtn').onclick=hideContactEditor;async function loadContacts(){const {data}=await sb.from('bni_member_contacts').select('*').eq('member_id',current.id).order('sort_order').order('created_at');$('contactList').innerHTML=data?.length?data.map(c=>`<div class="repeat-card" data-t="${c.id}"><div class="repeat-head"><div><b>${esc(c.label)}</b><div class="help">${esc(c.display_value||'')}</div><div class="help">${esc(c.url)}</div></div><div class="inline-actions"><button class="btn secondary e">編輯</button><button class="btn danger d">刪除</button></div></div></div>`).join(''):'<div class="empty">目前沒有聯絡方式。</div>';document.querySelectorAll('[data-t]').forEach(x=>{x.querySelector('.e').onclick=async()=>{const q=await sb.from('bni_member_contacts').select('*').eq('id',x.dataset.t).single();if(q.data)showContactEditor(q.data)};x.querySelector('.d').onclick=e=>armDelete(e.currentTarget,'bni_member_contacts',x.dataset.t,loadContacts)})}$('saveContactBtn').onclick=async()=>{const id=$('contact_id').value,label=$('contact_label').value.trim(),url=$('contact_url').value.trim();if(!label||!url)return note($('globalNotice'),'請輸入標題與連結。','error');const p={member_id:current.id,label,display_value:$('contact_display').value.trim()||null,type:$('contact_type').value||'link',url,is_published:true},q=id?sb.from('bni_member_contacts').update(p).eq('id',id):sb.from('bni_member_contacts').insert(p),{error}=await q;if(error)return note($('globalNotice'),'聯絡方式儲存失敗：'+error.message,'error');hideContactEditor();await loadContacts()};
