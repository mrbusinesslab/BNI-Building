name: Patch admin member visibility

on:
  push:
    paths:
      - '.github/workflows/patch-admin-visibility.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch admin visibility controls
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('admin/index.html')
          s=p.read_text(encoding='utf-8')

          old='.member-item b{display:block}.member-item span{font-size:12px;color:var(--muted)}'
          new='.member-item b{display:block}.member-item span{font-size:12px;color:var(--muted)}.member-item.member-hidden{opacity:.68;background:#f7f7f7}.member-status{display:inline-block;margin-top:6px;padding:3px 7px;border-radius:999px;font-size:11px!important;font-weight:800}.member-status.visible{background:#eaf7f0;color:var(--ok)!important}.member-status.hidden-status{background:#fff0f0;color:var(--danger)!important}.visibility-box{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:14px 16px;margin:14px 0;border:1px solid var(--line);border-radius:14px;background:#fbfcfd}.visibility-box b{display:block;margin-bottom:4px}.visibility-box .help{margin:0}.visibility-box .btn{flex:0 0 auto}'
          assert old in s
          s=s.replace(old,new,1)

          old='<div class="field"><label>電子名片 JSON URL</label><input id="m_card_json_url"></div><div class="savebar">'
          new='<div class="field"><label>電子名片 JSON URL</label><input id="m_card_json_url"></div><div class="visibility-box"><div><b id="memberVisibilityTitle">前台顯示中</b><div class="help" id="memberVisibilityHelp">此成員目前會出現在前台名單與需求配對。</div></div><button class="btn danger" id="toggleMemberVisibilityBtn" type="button">隱藏人員</button></div><div class="savebar">'
          assert old in s
          s=s.replace(old,new,1)

          old="members=data||[];$('memberList').innerHTML=members.map(m=>`<button class=\"member-item ${current?.id===m.id?'active':''}\" data-id=\"${m.id}\"><b>${esc(m.name)}</b><span>${esc(m.company||'')}</span></button>`).join('');"
          new="members=data||[];$('memberList').innerHTML=members.map(m=>`<button class=\"member-item ${current?.id===m.id?'active':''} ${m.is_published===false?'member-hidden':''}\" data-id=\"${m.id}\"><b>${esc(m.name)}</b><span>${esc(m.company||'')}</span><span class=\"member-status ${m.is_published===false?'hidden-status':'visible'}\">${m.is_published===false?'前台隱藏':'前台顯示'}</span></button>`).join('');"
          assert old in s
          s=s.replace(old,new,1)

          old="renderAnalysis('editAnalysis',{problems:current.problem_keys||[],roles:current.role_keys||[]});hideCaseEditor();"
          new="renderAnalysis('editAnalysis',{problems:current.problem_keys||[],roles:current.role_keys||[]});refreshVisibilityUi();hideCaseEditor();"
          assert old in s
          s=s.replace(old,new,1)

          marker="$('saveBasicBtn').onclick=async()=>{"
          idx=s.find(marker)
          assert idx!=-1
          end=s.find("\nasync function upload",idx)
          assert end!=-1
          insert="\nfunction refreshVisibilityUi(){if(!current)return;const hidden=current.is_published===false;$('memberVisibilityTitle').textContent=hidden?'前台已隱藏':'前台顯示中';$('memberVisibilityHelp').textContent=hidden?'資料仍完整保留，只是不會出現在前台名單、需求配對與人物搜尋。':'此成員目前會出現在前台名單、需求配對與人物搜尋。';const b=$('toggleMemberVisibilityBtn');b.textContent=hidden?'恢復顯示':'隱藏人員';b.className='btn '+(hidden?'secondary':'danger')}\n$('toggleMemberVisibilityBtn').onclick=async()=>{if(!current)return;const next=current.is_published===false;const {data,error}=await sb.from('bni_members').update({is_published:next}).eq('id',current.id).select().single();if(error)return note($('globalNotice'),'更新顯示狀態失敗：'+error.message,'error');current=data;members=members.map(x=>x.id===data.id?data:x);refreshVisibilityUi();note($('globalNotice'),next?'已恢復前台顯示。':'已隱藏此人員，所有資料與紀錄仍保留。');await loadMembers()};\n"
          s=s[:end]+insert+s[end:]

          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit patch and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/patch-admin-visibility.yml
          git add admin/index.html
          git commit -m "Add admin member visibility toggle"
          git push
