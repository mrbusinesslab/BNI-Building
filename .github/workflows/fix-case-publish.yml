name: Fix case publish feedback
# trigger
on:
  push:
    paths:
      - '.github/workflows/fix-case-publish.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch case publishing flow
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('admin/index.html')
          s=p.read_text()
          old="""$('saveCaseBtn').onclick=async()=>{const id=$('case_id').value,title=$('case_title').value.trim();if(!title)return note($('globalNotice'),'案例需要文章標題。','error');let image_url=currentCaseImage||null,file=$('case_image').files?.[0];if(file)image_url=await upload(file,'cases');const p={member_id:current.id,title,description:$('case_description').value.trim()||null,link_url:$('case_link').value.trim()||null,image_url,is_published:true},q=id?sb.from('bni_member_cases').update(p).eq('id',id):sb.from('bni_member_cases').insert(p),{error}=await q;if(error)return note($('globalNotice'),'案例儲存失敗：'+error.message,'error');hideCaseEditor();await loadCases()};"""
          new="""$('saveCaseBtn').onclick=async()=>{const btn=$('saveCaseBtn'),id=$('case_id').value,title=$('case_title').value.trim();if(!title)return note($('globalNotice'),'案例需要文章標題。','error');if(btn.dataset.busy==='1')return;btn.dataset.busy='1';const originalText=id?'儲存修改':'發布案例';btn.disabled=true;btn.textContent='發布中…';note($('globalNotice'),'正在發布案例，請稍候。');try{let image_url=currentCaseImage||null,file=$('case_image').files?.[0];if(file){btn.textContent='圖片上傳中…';try{image_url=await upload(file,'cases')}catch(err){throw new Error('圖片上傳失敗：'+(err?.message||String(err)))}}btn.textContent='案例儲存中…';const p={member_id:current.id,title,description:$('case_description').value.trim()||null,link_url:$('case_link').value.trim()||null,image_url,is_published:true};const q=id?sb.from('bni_member_cases').update(p).eq('id',id):sb.from('bni_member_cases').insert(p);const {error}=await q;if(error)throw new Error('案例發布失敗：'+error.message);hideCaseEditor();await loadCases();note($('globalNotice'),id?'案例已更新。':'案例已發布。')}catch(err){note($('globalNotice'),err?.message||'案例發布失敗，請稍後再試。','error')}finally{btn.dataset.busy='0';btn.disabled=false;btn.textContent=originalText}};"""
          if old not in s:
              raise SystemExit('target handler not found')
          p.write_text(s.replace(old,new))
          PY
      - name: Remove one-time workflow
        run: rm .github/workflows/fix-case-publish.yml
      - name: Commit
        run: |
          git config user.name 'openai-codex'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin/index.html .github/workflows/fix-case-publish.yml
          git commit -m 'Show case publish progress and errors'
          git push
